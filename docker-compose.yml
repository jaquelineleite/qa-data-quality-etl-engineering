services:
  postgres:
    image: postgres:16
    container_name: qa-data-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-qa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qa_password}
      POSTGRES_DB: ${DB_NAME:-qa_data_quality}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-qa_user} -d ${DB_NAME:-qa_data_quality}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
